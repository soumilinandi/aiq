[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 83"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "aiq-databricks-ontology"
version = "0.1.0"
description = "Databricks ontology-provider tools for NVIDIA AI-Q"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "databricks-sdk>=0.130.0,<1",
    "nvidia-nat-core==1.8.0",
    "nvidia-nat[langchain]==1.8.0",
    "pydantic>=2.0.0",
]

[project.entry-points."nat.plugins"]
databricks = "databricks_ontology.register"

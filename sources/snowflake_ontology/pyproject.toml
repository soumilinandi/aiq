[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 83"]

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "aiq-snowflake-ontology"
version = "0.1.0"
description = "Snowflake ontology-provider tools for NVIDIA AI-Q"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-core==1.8.0",
    "nvidia-nat[langchain]==1.8.0",
    "pydantic>=2.0.0",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "snowflake-connector-python>=4.7,<5",
]

[project.entry-points."nat.plugins"]
snowflake = "snowflake_ontology.register"
